<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Viewer Dokumen Enterprise — KKG PAI</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: '#EAFFD0',
            brandSurface: '#FFFFFF',
            brandBorder: '#E3F0D0',
            brandInk: '#2B3A3A',
            brandMuted: '#6E827D',
            brandCoral: '#F38181',
            brandCoralDark: '#D65A5A',
            brandMint: '#95E1D3',
            brandMintDark: '#2E8B7A'
          },
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      color: #2B3A3A;
      background: #EAFFD0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior-y: none;
    }
    .flip-book {
      display: none;
      box-shadow: 0 15px 40px rgba(43,58,58,0.18);
    }
    .page {
      background-color: #FFFFFF;
      overflow: hidden;
      border: 1px solid #E3F0D0;
    }
    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    /* Toast Notification Animation */
    @keyframes slideIn {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast-animate {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-brandBg text-brandInk flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="bg-white/92 backdrop-blur-md border-b border-brandBorder px-5 py-3 flex items-center justify-between z-20 shadow-sm">
    <div class="flex items-center gap-3">
      <span class="text-xl">📘</span>
      <span id="titleDisplay" class="text-brandMintDark font-fredoka font-bold text-sm sm:text-base bg-brandMint/25 px-3.5 py-1 rounded-full max-w-[45vw] truncate">
        Memuat Dokumen...
      </span>
    </div>
    <a href="index.html" id="backBtn" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-brandCoral hover:bg-brandCoralDark text-white font-extrabold text-sm transition-all shadow-sm hover:-translate-y-0.5">
      ⬅ Katalog
    </a>
  </header>

  <!-- Main Viewer Stage -->
  <main class="flex-1 relative flex justify-center items-center overflow-hidden p-4 sm:p-5">
    
    <!-- Loading Screen & Spinner -->
    <div id="loadingScreen" class="absolute inset-0 bg-brandBg flex flex-col justify-center items-center gap-4 z-30 font-bold text-brandMuted text-center p-5 transition-opacity duration-400">
      <div class="w-11 h-11 border-4 border-brandCoral/20 border-t-brandCoral rounded-full animate-spin"></div>
      <span id="loadingText">Menghubungkan ke server & mengunduh dokumen...</span>
    </div>

    <!-- Stage Wrapper -->
    <div class="w-full h-full max-w-[1100px] flex flex-col gap-2.5" id="stageWrap" hidden>
      
      <!-- Toolbar -->
      <div class="flex items-center justify-between gap-2.5 px-1 flex-shrink-0">
        <span class="font-fredoka font-semibold text-sm text-brandMintDark truncate" id="stageTitle">Dokumen</span>
        <div class="flex items-center gap-2 flex-shrink-0">
          <span class="text-xs font-extrabold text-brandMuted bg-white border border-brandBorder px-3 py-1.5 rounded-full" id="pageIndicator" hidden></span>
          <button class="w-9 h-9 rounded-xl border border-brandBorder bg-white flex items-center justify-center text-brandMuted hover:text-brandCoral hover:border-brandCoral transition-all cursor-pointer shadow-sm" id="fullscreenBtn" title="Layar penuh" hidden>
            <svg id="fullscreenIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Progress Track -->
      <div class="h-1 rounded-full bg-brandBorder overflow-hidden flex-shrink-0 mx-1" id="progressTrack" hidden>
        <div class="h-full w-0 bg-gradient-to-r from-brandMint to-brandCoral transition-all duration-350 rounded-full" id="progressFill"></div>
      </div>

      <!-- Stage Frame -->
      <div class="flex-1 min-h-0 bg-white border border-brandBorder rounded-3xl shadow-xl flex items-center justify-center p-3 sm:p-8 relative overflow-hidden" id="stageFrame">
        <div id="book" class="flip-book"></div>
        <iframe id="htmlViewer" class="w-full h-full border-none bg-white rounded-xl shadow-inner" style="display:none;" sandbox="allow-scripts allow-same-origin"></iframe>
        
        <!-- Navigation Buttons -->
        <button class="absolute top-1/2 -translate-y-1/2 left-3.5 w-11 h-11 rounded-full border border-brandBorder bg-white/90 backdrop-blur-md shadow-lg flex items-center justify-center text-brandMuted cursor-pointer z-10 transition-all hover:bg-brandCoral hover:text-white hover:border-brandCoral hover:scale-105 disabled:opacity-20 disabled:pointer-events-none" id="navPrev" title="Halaman sebelumnya" hidden>
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="absolute top-1/2 -translate-y-1/2 right-3.5 w-11 h-11 rounded-full border border-brandBorder bg-white/90 backdrop-blur-md shadow-lg flex items-center justify-center text-brandMuted cursor-pointer z-10 transition-all hover:bg-brandCoral hover:text-white hover:border-brandCoral hover:scale-105 disabled:opacity-20 disabled:pointer-events-none" id="navNext" title="Halaman berikutnya" hidden>
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- External Libraries: PDF.js & Page-Flip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

  <script>
    /**
     * Enterprise Frontend Architecture & Lazy-Rendering Engine
     */
    
    // 1. Toast Notification Manager
    class Toast {
      static show(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        
        let bg = 'bg-brandInk text-white';
        if (type === 'error') bg = 'bg-brandCoralDark text-white';
        if (type === 'success') bg = 'bg-brandMintDark text-white';

        toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg text-sm font-semibold toast-animate ${bg}`;
        toast.textContent = message;
        
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(10px)';
          toast.style.transition = 'all 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 3500);
      }
    }

    // 2. Client-Side TTL Caching Module
    class CacheManager {
      static set(key, data, ttlMinutes = 60) {
        const item = {
          data: data,
          expiry: new Date().getTime() + (ttlMinutes * 60 * 1000)
        };
        try {
          sessionStorage.setItem(key, JSON.stringify(item));
        } catch (e) {
          console.warn("Storage quota exceeded, clearing session cache.", e);
          sessionStorage.clear();
        }
      }

      static get(key) {
        const itemStr = sessionStorage.getItem(key);
        if (!itemStr) return null;
        try {
          const item = JSON.parse(itemStr);
          if (new Date().getTime() > item.expiry) {
            sessionStorage.removeItem(key);
            return null;
          }
          return item.data;
        } catch (e) {
          sessionStorage.removeItem(key);
          return null;
        }
      }
    }

    // 3. Modern Fetch API Wrapper with Single-Trip & Batching readiness
    class ApiClient {
      constructor(apiUrl) {
        this.apiUrl = apiUrl;
      }

      async fetchFile(fileId, format) {
        const cacheKey = `doc_${fileId}_${format}`;
        const cached = CacheManager.get(cacheKey);
        if (cached) {
          Toast.show("Memuat dari cache lokal (Instan)", "success");
          return cached;
        }

        const url = `${this.apiUrl}?action=getfile&id=${fileId}&format=${format}`;
        const response = await fetch(url, { method: 'GET' });
        
        if (!response.ok) {
          throw new Error(`HTTP Error Status: ${response.status}`);
        }

        const json = await response.json();
        if (!json.ok) {
          throw new Error(json.error || "Gagal mengambil data dari Google Apps Script.");
        }

        CacheManager.set(cacheKey, json, 30); // Simpan TTL 30 menit
        return json;
      }
    }

    // 4. Lazy-Rendering PDF Flipbook Controller
    class LazyViewerEngine {
      constructor() {
        // Ganti dengan URL deployment Web App Google Apps Script Anda yang terbaru
        this.API_URL = "https://script.google.com/macros/s/AKfycbyJnpdt56Iu9zOlIQdbp00vapGrRYTyAAcvLFGLrh3hah04n6EwK_tgbrc5A1kUNw5y9A/exec";
        this.params = new URLSearchParams(window.location.search);
        this.api = new ApiClient(this.API_URL);

        this.dom = {
          title: document.getElementById('titleDisplay'),
          loading: document.getElementById('loadingScreen'),
          loadingText: document.getElementById('loadingText'),
          stageWrap: document.getElementById('stageWrap'),
          stageFrame: document.getElementById('stageFrame'),
          stageTitle: document.getElementById('stageTitle'),
          pageIndicator: document.getElementById('pageIndicator'),
          progressTrack: document.getElementById('progressTrack'),
          progressFill: document.getElementById('progressFill'),
          navPrev: document.getElementById('navPrev'),
          navNext: document.getElementById('navNext'),
          fullscreenBtn: document.getElementById('fullscreenBtn'),
          fullscreenIcon: document.getElementById('fullscreenIcon'),
          book: document.getElementById('book'),
          htmlViewer: document.getElementById('htmlViewer')
        };

        this.pdfDoc = null;
        this.totalPages = 0;
        this.pageFlip = null;
        this.renderedPages = new Set();
        this.aspectRatio = 1.414; // Rasio standar A4 potret

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }

      async init() {
        const title = this.params.get('judul');
        const fileId = this.params.get('id');
        const format = this.params.get('format') || 'pdf';

        if (title) {
          this.dom.title.textContent = title;
          this.dom.stageTitle.textContent = title;
        }

        if (!fileId) {
          this.showError("Parameter ID File tidak valid atau kosong.");
          return;
        }

        this.setupFullscreen();
        this.setupKeyboardNav();

        try {
          this.dom.loadingText.textContent = "Mengunduh dokumen dari server...";
          const data = await this.api.fetchFile(fileId, format);

          if (format === 'html') {
            this.renderHTML(data.content);
          } else {
            await this.initPDFEngine(data.content);
          }
        } catch (error) {
          this.showError(`Gagal memuat dokumen: ${error.message}`);
          Toast.show("Gagal memuat sistem viewer.", "error");
        }
      }

      setupKeyboardNav() {
        document.addEventListener('keydown', (e) => {
          if (!this.pageFlip) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); this.pageFlip.flipNext(); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); this.pageFlip.flipPrev(); }
        });
      }

      setupFullscreen() {
        const supported = document.fullscreenEnabled || document.webkitFullscreenEnabled;
        if (!supported) return;

        this.dom.fullscreenBtn.hidden = false;
        this.dom.fullscreenBtn.addEventListener('click', () => {
          const el = this.dom.stageWrap;
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (!isFs) {
            (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
          } else {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          }
        });

        const onFsChange = () => {
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          this.dom.fullscreenIcon.innerHTML = isFs 
            ? '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>'
            : '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
        };
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
      }

      renderHTML(content) {
        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.stageWrap.hidden = false;
          this.dom.htmlViewer.style.display = 'block';
          this.dom.htmlViewer.srcdoc = content;
          Toast.show("Dokumen HTML berhasil dimuat.", "success");
        }, 300);
      }

      async initPDFEngine(base64Str) {
        this.dom.loadingText.textContent = "Memproses struktur PDF...";
        
        // Optimasi konversi Base64 ke ArrayBuffer tanpa blocking UI thread
        const cleanStr = base64Str.replace(/\s/g, "");
        const res = await fetch(`data:application/pdf;base64,${cleanStr}`);
        const pdfData = new Uint8Array(await res.arrayBuffer());

        const loadingTask = pdfjsLib.getDocument({ data: pdfData });
        this.pdfDoc = await loadingTask.promise;
        this.totalPages = this.pdfDoc.numPages;

        // Ambil rasio halaman pertama untuk ukuran proporsional
        const firstPage = await this.pdfDoc.getPage(1);
        const vp = firstPage.getViewport({ scale: 1 });
        this.aspectRatio = vp.width / vp.height;

        // Buat Placeholder DOM untuk seluruh halaman (Lazy Container Creation)
        const fragment = document.createDocumentFragment();
        
        // Selipkan halaman kosong di awal agar halaman 1 pas di sebelah kanan
        const blankLeaf = document.createElement('div');
        blankLeaf.className = 'page page-blank';
        fragment.appendChild(blankLeaf);

        for (let i = 1; i <= this.totalPages; i++) {
          const pageWrap = document.createElement('div');
          pageWrap.className = 'page';
          pageWrap.dataset.pageNum = i;
          
          const canvas = document.createElement('canvas');
          canvas.id = `pdf-canvas-${i}`;
          pageWrap.appendChild(canvas);
          fragment.appendChild(pageWrap);
        }

        this.dom.book.appendChild(fragment);

        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.stageWrap.hidden = false;
          this.dom.book.style.display = 'block';
          this.setupPageFlipEngine();
        }, 300);
      }

      computeFitSize() {
        const rect = this.dom.stageFrame.getBoundingClientRect();
        const availW = Math.max(200, rect.width - 30);
        const availH = Math.max(240, rect.height - 30);

        const isNarrow = window.innerWidth < 700;
        const widthFromWidth = isNarrow ? availW : availW / 2;
        const widthFromHeight = availH * this.aspectRatio;
        const cap = isNarrow ? 540 : 460;
        const floor = isNarrow ? 220 : 200;

        let width = Math.min(widthFromWidth, widthFromHeight, cap);
        width = Math.max(width, floor);
        return { width: Math.round(width), height: Math.round(width / this.aspectRatio) };
      }

      async renderPageLazy(pageNum) {
        if (pageNum < 1 || pageNum > this.totalPages) return;
        if (this.renderedPages.has(pageNum)) return; // Sudah dirender, lewati

        try {
          const page = await this.pdfDoc.getPage(pageNum);
          const canvas = document.getElementById(`pdf-canvas-${pageNum}`);
          if (!canvas) return;

          const context = canvas.getContext('2d', { alpha: false });
          const outputScale = Math.min(window.devicePixelRatio || 1, 2.0);
          
          const nativeViewport = page.getViewport({ scale: 1 });
          // Render sesuai ukuran target canvas DOM
          const renderScale = (canvas.parentElement.clientWidth * outputScale) / nativeViewport.width || (400 * outputScale) / nativeViewport.width;
          const viewport = page.getViewport({ scale: renderScale > 0 ? renderScale : 1.5 });

          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);

          await page.render({ canvasContext: context, viewport: viewport }).promise;
          this.renderedPages.add(pageNum);
        } catch (err) {
          console.error(`Gagal merender halaman ${pageNum}:`, err);
        }
      }

      async renderAdjacentPages(currentIndex) {
        // Lazy-Rendering jendela aktif: Render halaman saat ini, sebelumnya, dan sesudahnya
        await this.renderPageLazy(currentIndex);
        await this.renderPageLazy(currentIndex + 1);
        await this.renderPageLazy(currentIndex - 1);
      }

      setupPageFlipEngine() {
        const { width, height } = this.computeFitSize();

        this.pageFlip = new St.PageFlip(this.dom.book, {
          width,
          height,
          size: "fixed",
          minWidth: 200,
          maxWidth: 540,
          minHeight: 260,
          maxHeight: 900,
          showCover: false,
          usePortrait: true,
          mobileScrollSupport: true,
          maxShadowOpacity: 0.35,
          drawShadow: true,
          flippingTime: 600
        });

        this.pageFlip.loadFromHTML(this.dom.book.querySelectorAll('.page'));

        // Render halaman awal (1 & 2) secara instan
        this.renderAdjacentPages(1);

        this.dom.pageIndicator.hidden = false;
        this.dom.progressTrack.hidden = false;
        this.dom.navPrev.hidden = false;
        this.dom.navNext.hidden = false;

        const updateUI = (current) => {
          const clamped = Math.max(1, Math.min(current, this.totalPages));
          this.dom.pageIndicator.textContent = `Halaman ${clamped} / ${this.totalPages}`;
          this.dom.progressFill.style.width = `${(clamped / this.totalPages) * 100}%`;
          this.dom.navPrev.disabled = clamped <= 1;
          this.dom.navNext.disabled = clamped >= this.totalPages;
          
          // Panggil Lazy Renderer untuk halaman aktif
          this.renderAdjacentPages(clamped);
        };

        updateUI(1);
        this.pageFlip.on('flip', (e) => updateUI(e.data));

        // Event listener tombol navigasi
        const rebindBtn = (btn, action) => {
          const fresh = btn.cloneNode(true);
          btn.parentNode.replaceChild(fresh, btn);
          fresh.addEventListener('click', () => this.pageFlip[action]());
          return fresh;
        };
        this.dom.navPrev = rebindBtn(this.dom.navPrev, 'flipPrev');
        this.dom.navNext = rebindBtn(this.dom.navNext, 'flipNext');

        // Responsive Handler dengan ResizeObserver tanpa menghancurkan instance buku
        if ('ResizeObserver' in window) {
          let resizeTimer;
          const observer = new ResizeObserver(() => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
              const newSize = this.computeFitSize();
              if (this.pageFlip) {
                // Gunakan update method bawaan PageFlip untuk stabilitas ukuran
                this.pageFlip.update({ width: newSize.width, height: newSize.height });
              }
            }, 200);
          });
          observer.observe(this.dom.stageFrame);
        }

        Toast.show("Dokumen siap dibaca dengan Lazy-Rendering.", "success");
      }

      showError(msg) {
        console.error("Viewer Error:", msg);
        this.dom.loadingText.textContent = msg;
        const spinner = this.dom.loading.querySelector('.w-11');
        if (spinner) spinner.style.display = 'none';
        this.dom.loadingText.className = "text-brandCoralDark font-bold text-sm sm:text-base px-4";
        Toast.show(msg, "error");
      }
    }

    // Inisialisasi saat DOM siap
    document.addEventListener('DOMContentLoaded', () => {
      const viewer = new LazyViewerEngine();
      viewer.init();
    });
  </script>
</body>
</html>
