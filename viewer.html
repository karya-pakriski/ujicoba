<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Viewer Dokumen — KKG PAI Kulon Progo</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #EAFFD0;
      --surface: #FFFFFF;
      --border: #E3F0D0;
      --ink: #2B3A3A;
      --ink-muted: #6E827D;
      --coral: #F38181;
      --coral-dark: #D65A5A;
      --mint: #95E1D3;
      --mint-dark: #2E8B7A;
      --header-bg: rgba(255,255,255,0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior-y: none;
    }

    .header {
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .brand {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .doc-title {
      color: var(--mint-dark);
      font-size: 0.95rem;
      font-weight: 700;
      background: rgba(149,225,211,0.25);
      padding: 4px 14px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45vw;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--coral);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-back:hover { 
      background: var(--coral-dark);
      transform: translateY(-1px);
    }

    .viewer-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 18px;
    }

    /* Wadah tengah: judul + toolbar di atas, panel buku di bawahnya — supaya
       buku tidak menempel langsung dari header ke footer. */
    .stage-wrap {
      width: 100%;
      height: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .stage-title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--mint-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .page-indicator {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--ink-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 13px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .icon-btn:hover { color: var(--coral); border-color: var(--coral); transform: translateY(-1px); }
    .icon-btn svg { width: 17px; height: 17px; }

    /* Panel/kotak wadah tempat buku "mengambang" di tengah, dengan jarak dari tepi */
    .stage-frame {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(43,58,58,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 3vw, 34px);
      position: relative;
      overflow: hidden;
    }

    .stage-wrap:fullscreen,
    .stage-wrap:-webkit-full-screen {
      max-width: 100%;
      padding: 16px;
      background: var(--bg);
    }
    .stage-wrap:fullscreen .stage-frame,
    .stage-wrap:-webkit-full-screen .stage-frame {
      border-radius: 18px;
    }

    .progress-track {
      height: 4px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
      flex-shrink: 0;
      margin: 0 4px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--mint), var(--coral));
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 10px 24px rgba(43,58,58,0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      cursor: pointer;
      z-index: 6;
      transition: all 0.15s ease;
    }
    .nav-btn:hover { color: #fff; background: var(--coral); border-color: var(--coral); transform: translateY(-50%) scale(1.08); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
    .nav-btn svg { width: 19px; height: 19px; }
    .nav-prev { left: 14px; }
    .nav-next { right: 14px; }

    #loadingScreen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      z-index: 15;
      font-weight: 700;
      color: var(--ink-muted);
      text-align: center;
      padding: 20px;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(243, 129, 129, 0.2);
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .flip-book {
      display: none;
      box-shadow: 0 15px 40px rgba(43,58,58,0.18);
    }

    .page {
      background-color: var(--surface);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #htmlViewer {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(43,58,58,0.10);
    }

    @media (max-width: 768px) {
      .doc-title { max-width: 30vw; font-size: 0.85rem; }
      .header { padding: 10px 14px; }
      .btn-back { padding: 6px 14px; font-size: 13px; }
      .viewer-area { padding: 8px; }
      .stage-frame { border-radius: 18px; padding: 12px; }
      .stage-title { font-size: 0.8rem; }
      .page-indicator { font-size: 0.7rem; padding: 4px 10px; }
      .nav-btn { width: 36px; height: 36px; }
      .nav-btn svg { width: 15px; height: 15px; }
      .nav-prev { left: 6px; }
      .nav-next { right: 6px; }
    }

    @media (max-width: 480px) {
      .doc-title { display: none; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <span class="logo-icon">📘</span>
      <span id="titleDisplay" class="doc-title">Memuat Dokumen...</span>
    </div>
    <a href="index.html" class="btn-back">⬅ Katalog</a>
  </header>

  <main class="viewer-area">
    <div id="loadingScreen">
      <div class="spinner"></div>
      <span id="loadingText">Mengunduh dokumen, mohon tunggu...</span>
    </div>

    <div class="stage-wrap" id="stageWrap" hidden>
      <div class="stage-toolbar">
        <span class="stage-title" id="stageTitle">Dokumen</span>
        <div class="stage-actions">
          <span class="page-indicator" id="pageIndicator" hidden></span>
          <button class="icon-btn" id="fullscreenBtn" title="Layar penuh" hidden>
            <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="progress-track" id="progressTrack" hidden><div class="progress-fill" id="progressFill"></div></div>
      <div class="stage-frame" id="stageFrame">
        <div id="book" class="flip-book"></div>
        <iframe id="htmlViewer" sandbox="allow-scripts allow-same-origin"></iframe>
        <button class="nav-btn nav-prev" id="navPrev" title="Halaman sebelumnya (←)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="nav-btn nav-next" id="navNext" title="Halaman berikutnya (→)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

  <script>
    class ViewerEngine {
      constructor() {
        this.API_URL = "https://script.google.com/macros/s/AKfycbyJnpdt56Iu9zOlIQdbp00vapGrRYTyAAcvLFGLrh3hah04n6EwK_tgbrc5A1kUNw5y9A/exec";
        this.params = new URLSearchParams(window.location.search);
        
        this.dom = {
          title: document.getElementById('titleDisplay'),
          loading: document.getElementById('loadingScreen'),
          loadingText: document.getElementById('loadingText'),
          spinner: document.querySelector('.spinner'),
          stageWrap: document.getElementById('stageWrap'),
          stageFrame: document.getElementById('stageFrame'),
          stageTitle: document.getElementById('stageTitle'),
          pageIndicator: document.getElementById('pageIndicator'),
          progressTrack: document.getElementById('progressTrack'),
          progressFill: document.getElementById('progressFill'),
          navPrev: document.getElementById('navPrev'),
          navNext: document.getElementById('navNext'),
          fullscreenBtn: document.getElementById('fullscreenBtn'),
          fullscreenIcon: document.getElementById('fullscreenIcon'),
          book: document.getElementById('book'),
          htmlViewer: document.getElementById('htmlViewer')
        };

        this.ICON_EXPAND = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
        this.ICON_COLLAPSE = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }

      init() {
        const title = this.params.get('judul');
        if (title) {
          this.dom.title.textContent = title;
          this.dom.stageTitle.textContent = title;
        }
        this.setupFullscreen();
        this.setupKeyboardNav();
        this.loadDocument();
      }

      // Navigasi keyboard: panah kiri/kanan untuk membalik halaman.
      // Swipe/usap jari sebenarnya SUDAH otomatis didukung oleh page-flip.js
      // (drag langsung di atas buku), jadi cukup tambahkan dukungan keyboard
      // dan tombol panah di layar sebagai pelengkap.
      setupKeyboardNav() {
        document.addEventListener('keydown', (e) => {
          if (!this.pageFlip) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); this.pageFlip.flipNext(); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); this.pageFlip.flipPrev(); }
        });
      }

      // Tombol layar penuh: memakai Fullscreen API pada stage-wrap saja
      // (bukan seluruh dokumen) supaya header tetap konsisten dan mudah keluar.
      setupFullscreen() {
        const supported = document.fullscreenEnabled || document.webkitFullscreenEnabled;
        if (!supported) return; // sembunyikan tombol jika browser tidak mendukung (mis. Safari iOS)

        this.dom.fullscreenBtn.hidden = false;
        this.dom.fullscreenBtn.addEventListener('click', () => {
          const el = this.dom.stageWrap;
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (!isFs) {
            (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
          } else {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          }
        });

        const onFsChange = () => {
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          this.dom.fullscreenIcon.innerHTML = isFs ? this.ICON_COLLAPSE : this.ICON_EXPAND;
          this.dom.fullscreenBtn.title = isFs ? 'Keluar layar penuh' : 'Layar penuh';
        };
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
      }

      /**
       * Engine Dekode Berkecepatan Tinggi (Native C++ Browser Execution)
       * Memanfaatkan Fetch API untuk mengubah Base64 menjadi ArrayBuffer
       * secara instan tanpa mengunci Main Thread JS (bebas freeze)
       */
      async decodeBase64Optimized(base64Str) {
        const cleanStr = base64Str.replace(/\s/g, "");
        const dataUrl = `data:application/pdf;base64,${cleanStr}`;
        const response = await fetch(dataUrl);
        return new Uint8Array(await response.arrayBuffer());
      }

      async loadDocument() {
        const fileId = this.params.get('id');
        const format = this.params.get('format');

        if (!fileId) {
          this.showError("Parameter ID File tidak ditemukan.");
          return;
        }

        try {
          const response = await fetch(`${this.API_URL}?action=getfile&id=${fileId}&format=${format}`);
          if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
          
          const data = await response.json();
          if (!data.ok) throw new Error(data.error);

          if (format === 'html') {
            this.renderHTML(data.content);
          } else if (format === 'pdf') {
            await this.renderPDF(data.content);
          }
        } catch (error) {
          this.showError(`Gagal memuat sistem: ${error.message}`);
        }
      }

      renderHTML(content) {
        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.stageWrap.hidden = false;
          this.dom.htmlViewer.style.display = 'block';
          this.dom.htmlViewer.srcdoc = content; 
        }, 400);
      }

      async renderPDF(base64Content) {
        this.dom.loadingText.textContent = "Membuka dokumen...";

        // Eksekusi asinkron Fetch API menggantikan perulangan atob tradisional
        const pdfData = await this.decodeBase64Optimized(base64Content);
        base64Content = null; // Memicu Garbage Collection untuk pembersihan memori

        const loadingTask = pdfjsLib.getDocument({ data: pdfData });
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;

        // Ukuran tampil target (mengikuti ukuran flipbook, BUKAN resolusi native PDF).
        // Ini kunci performa: sebelumnya kanvas dirender pada scale 1.5 x devicePixelRatio
        // penuh (bisa 3x di HP), padahal yang tampil di layar hanya ~380-520px lebar.
        const targetWidth = this.getTargetBookWidth();
        // Batasi devicePixelRatio efektif ke maksimum 2 — di atas itu tidak terlihat
        // bedanya untuk teks buku, tapi biaya render naik kuadratik.
        const outputScale = Math.min(window.devicePixelRatio || 1, 2.5);

        const fragment = document.createDocumentFragment();
        // Placeholder array supaya urutan halaman tetap benar walau dirender paralel
        const pageWrappers = new Array(totalPages);
        let baseWidth = targetWidth;
        let baseHeight = targetWidth * 1.414;
        let rendered = 0;

        const renderPage = async (pageNum) => {
          const page = await pdf.getPage(pageNum);
          const nativeViewport = page.getViewport({ scale: 1 });

          if (pageNum === 1) {
            baseWidth = nativeViewport.width;
            baseHeight = nativeViewport.height;
          }

          // Skala dihitung agar resolusi kanvas pas dengan ukuran tampil x outputScale,
          // bukan resolusi asli PDF (yang seringkali jauh lebih besar dari kebutuhan layar).
          const renderScale = (targetWidth * outputScale) / nativeViewport.width;
          const viewport = page.getViewport({ scale: renderScale });

          const pageWrapper = document.createElement('div');
          pageWrapper.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d', { alpha: false });

          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          // PENTING: ukuran TAMPIL kanvas TIDAK dikunci ke px di sini — biarkan
          // aturan CSS "width:100%; height:100%" yang berlaku, sehingga kanvas
          // selalu mengikuti ukuran wadah .page yang diatur PageFlip (autofit),
          // berapa pun ukuran layarnya. canvas.width/height di bawah ini hanya
          // menentukan resolusi bitmap (ketajaman gambar), bukan ukuran tampil —
          // kalau dikunci ke px, saat wadah dihitung ulang (misal keluar-masuk
          // fullscreen) ukurannya bisa tidak sinkron dan bagian tepi terpotong.

          pageWrapper.appendChild(canvas);
          pageWrappers[pageNum - 1] = pageWrapper;

          await page.render({ canvasContext: context, viewport: viewport }).promise;

          rendered++;
          this.dom.loadingText.textContent = `Merender halaman ${rendered} dari ${totalPages}...`;
        };

        // Render per-batch paralel (bukan satu-satu berurutan) untuk memangkas waktu tunggu total.
        const BATCH_SIZE = 4;
        for (let start = 1; start <= totalPages; start += BATCH_SIZE) {
          const batch = [];
          for (let n = start; n < start + BATCH_SIZE && n <= totalPages; n++) batch.push(renderPage(n));
          await Promise.all(batch);
        }

        // Selipkan 1 halaman kosong (biasa/soft, sama seperti halaman lain) di paling
        // depan. Ini membuat halaman 1 dokumen otomatis "geser" ke posisi kanan —
        // sesuai konvensi buku (halaman ganjil selalu di kanan) — tanpa perlu opsi
        // showCover (yang memaksa animasi kaku/hard-page, cocok hanya jika dokumen
        // memang punya desain sampul terpisah).
        const blankLeaf = document.createElement('div');
        blankLeaf.className = 'page page-blank';
        fragment.appendChild(blankLeaf);

        pageWrappers.forEach(w => fragment.appendChild(w));

        // Menyisipkan seluruh DOM sekaligus
        this.dom.book.appendChild(fragment);

        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.stageWrap.hidden = false;
          this.dom.book.style.display = 'block';
          this.initFlipEngine(baseWidth, baseHeight, totalPages);
        }, 300);
      }

      // Ukuran dasar untuk RESOLUSI RENDER kanvas (bukan ukuran tampil — itu diatur
      // terpisah oleh computeFitSize/PageFlip). Dinaikkan sedikit dari sebelumnya
      // karena sekarang pinch-zoom browser aktif, supaya teks tetap tajam saat
      // pembaca memperbesar halaman dengan jari.
      getTargetBookWidth() {
        const vw = window.innerWidth;
        return Math.round(Math.min(560, Math.max(240, vw - 40)));
      }

      // Ukuran satu halaman dihitung agar PAS di dalam ruang yang tersedia —
      // baik dari sisi lebar maupun tinggi — supaya tidak ada bagian buku yang
      // terpotong. Di layar sempit (HP), buku ditampilkan SATU halaman penuh
      // (bukan dua berdampingan) agar konten cukup besar dibaca — sebelumnya
      // di HP tiap halaman dipaksa berbagi tempat jadi separuh lebar layar,
      // membuat teks terlalu kecil dan wadah terasa kosong/kebesaran.
      computeFitSize(aspectRatio) {
        const rect = this.dom.stageFrame.getBoundingClientRect();
        const buffer = 20; // jarak aman dari tepi panel
        const availW = Math.max(200, rect.width - buffer);
        const availH = Math.max(240, rect.height - buffer);

        const isNarrow = window.innerWidth < 700;
        // Layar lebar: 1 halaman = separuh lebar (karena 2 halaman berdampingan).
        // Layar sempit: 1 halaman = hampir seluruh lebar yang tersedia.
        const widthFromWidth = isNarrow ? availW : availW / 2;
        const widthFromHeight = availH * aspectRatio;
        const cap = isNarrow ? 560 : 480;
        const floor = isNarrow ? 220 : 200;

        let width = Math.min(widthFromWidth, widthFromHeight, cap);
        width = Math.max(width, floor);
        return { width: Math.round(width), height: Math.round(width / aspectRatio), isNarrow };
      }

      initFlipEngine(baseWidth, baseHeight, totalPages) {
        this.aspectRatio = baseWidth / baseHeight;
        this.totalPagesContent = totalPages;
        this._lastFitWidth = null;
        this.buildFlipBook();

        // Hitung ulang & bangun ulang ukuran buku saat window di-resize atau
        // saat masuk/keluar fullscreen — supaya selalu pas (autofit), tidak
        // pernah kepotong. Halaman sudah dirender, jadi membangun ulang di sini
        // murah (tanpa render ulang kanvas), hanya menata ulang tampilan.
        //
        // PENTING: pinch-zoom (cubit dua jari) kadang memicu event 'resize' juga
        // (terutama di iOS Safari), padahal itu bukan perubahan layar sungguhan.
        // Kalau tetap direspons, buku akan dibangun ulang di tengah gestur zoom
        // dan sempat "collapse" jadi kosong/putih sesaat — makanya kita cek dulu
        // via visualViewport.scale, dan lewati kalau sedang dalam mode zoom.
        const vv = window.visualViewport;
        const isZooming = () => !!(vv && Math.abs(vv.scale - 1) > 0.02);

        clearTimeout(this._fitResizeT);
        const scheduleRebuild = () => {
          if (isZooming()) return;
          clearTimeout(this._fitResizeT);
          this._fitResizeT = setTimeout(() => {
            if (isZooming()) return; // cek ulang setelah jeda, siapa tahu masih zoom
            this.buildFlipBook(true);
          }, 250);
        };
        window.addEventListener('resize', scheduleRebuild);
        document.addEventListener('fullscreenchange', scheduleRebuild);
        document.addEventListener('webkitfullscreenchange', scheduleRebuild);
      }

      buildFlipBook(preserveCurrent) {
        const { width, height } = this.computeFitSize(this.aspectRatio);

        // Pengaman tambahan: kalau ukuran hasil hitung tiba-tiba jauh lebih kecil
        // dari sebelumnya (misal terukur sesaat di tengah transisi/gestur zoom),
        // JANGAN lanjut membangun ulang — biarkan buku yang sudah tampil tetap
        // seperti semula daripada ikut hilang/blank karena angka yang keliru.
        if (this._lastFitWidth && width < this._lastFitWidth * 0.4) return;

        const currentIndex = (preserveCurrent && this.pageFlip) ? this.pageFlip.getCurrentPageIndex() : 0;
        if (this.pageFlip) {
          this.pageFlip.destroy();
          this.pageFlip = null;
        }

        // size:"fixed" karena ukurannya sudah kita hitung sendiri secara presisi
        // (autofit) — tidak mengandalkan heuristik stretch bawaan library yang
        // ternyata tidak memperhitungkan tinggi kontainer yang sebenarnya.
        this.pageFlip = new St.PageFlip(this.dom.book, {
          width,
          height,
          size: "fixed",
          minWidth: 200,
          maxWidth: 560,
          minHeight: 260,
          maxHeight: 900,
          showCover: false,
          usePortrait: true,
          mobileScrollSupport: true,
          maxShadowOpacity: 0.35,
          drawShadow: true,
          flippingTime: 700
        });

        this.pageFlip.loadFromHTML(this.dom.book.querySelectorAll('.page'));
        if (currentIndex > 0) {
          try { this.pageFlip.turnToPage(currentIndex); } catch (e) { /* abaikan jika index di luar batas */ }
        }
        this._lastFitWidth = width;


        this.dom.pageIndicator.hidden = false;
        this.dom.progressTrack.hidden = false;
        this.dom.navPrev.hidden = false;
        this.dom.navNext.hidden = false;

        const updateUI = (current) => {
          const clamped = Math.max(1, Math.min(current, this.totalPagesContent));
          this.dom.pageIndicator.textContent = `Halaman ${clamped} / ${this.totalPagesContent}`;
          this.dom.progressFill.style.width = `${(clamped / this.totalPagesContent) * 100}%`;
          this.dom.navPrev.disabled = clamped <= 1;
          this.dom.navNext.disabled = clamped >= this.totalPagesContent;
        };
        updateUI(Math.max(1, currentIndex));
        this.pageFlip.on('flip', (e) => updateUI(e.data));

        // Tombol panah di layar — hindari duplikasi listener saat buildFlipBook
        // dipanggil ulang (resize/fullscreen) dengan meng-clone tombolnya.
        const rebind = (btn, action) => {
          const fresh = btn.cloneNode(true);
          btn.parentNode.replaceChild(fresh, btn);
          fresh.addEventListener('click', () => this.pageFlip[action]());
          return fresh;
        };
        this.dom.navPrev = rebind(this.dom.navPrev, 'flipPrev');
        this.dom.navNext = rebind(this.dom.navNext, 'flipNext');
        updateUI(Math.max(1, currentIndex));
      }

      showError(msg) {
        console.error("Viewer Error:", msg);
        this.dom.loadingText.textContent = msg;
        this.dom.spinner.style.display = 'none';
        this.dom.loadingText.style.color = 'var(--coral)';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const viewer = new ViewerEngine();
      viewer.init();
    });
  </script>
</body>
</html>
