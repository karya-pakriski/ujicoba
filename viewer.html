<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Viewer Dokumen — KKG PAI Kulon Progo</title>

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="msapplication-TileColor" content="#ea6f6f">
  <meta name="theme-color" content="#f38181">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ===== VARIABEL ===== */
    :root {
      --bg: #EAFFD0;
      --surface: #FFFFFF;
      --border: #E3F0D0;
      --ink: #2B3A3A;
      --ink-muted: #6E827D;
      --coral: #F38181;
      --coral-dark: #D65A5A;
      --mint: #95E1D3;
      --mint-dark: #2E8B7A;
      --header-bg: rgba(255,255,255,0.94);
      --shadow-heavy: 0 20px 50px rgba(43,58,58,0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior-y: none;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(243,129,129,0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(149,225,211,0.12) 0%, transparent 45%);
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.02);
    }
    .brand {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand .logo-icon { font-size: 1.3rem; }
    .doc-title {
      color: var(--mint-dark);
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(149,225,211,0.20);
      padding: 3px 12px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 40vw;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--coral);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      flex-shrink: 0;
    }
    .btn-back:hover {
      background: var(--coral-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(243,129,129,0.30);
    }
    .btn-back svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.2; fill: none; }

    /* ===== AREA VIEWER ===== */
    .viewer-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px 8px 12px;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(149,225,211,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(243,129,129,0.05) 0%, transparent 50%),
        #e8e2d6;
      background-image:
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c4b8a8' fill-opacity='0.12'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* ===== WADAH UTAMA ===== */
    .stage-wrap {
      width: 100%;
      height: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 2px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .stage-title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--mint-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .stage-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .page-indicator {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--ink-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .icon-btn:hover { color: var(--coral); border-color: var(--coral); transform: translateY(-1px); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* Progress bar */
    .progress-track {
      height: 3px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
      flex-shrink: 0;
      margin: 0 2px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--mint), var(--coral));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Panel buku */
    .stage-frame {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow-heavy);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2.5vw, 28px);
      position: relative;
      overflow: hidden;
    }

    .stage-wrap:fullscreen,
    .stage-wrap:-webkit-full-screen {
      max-width: 100%;
      padding: 12px;
      background: var(--bg);
    }
    .stage-wrap:fullscreen .stage-frame,
    .stage-wrap:-webkit-full-screen .stage-frame {
      border-radius: 16px;
    }

    /* ===== LOADING ===== */
    #loadingScreen {
      position: absolute;
      inset: 0;
      background: rgba(232, 226, 214, 0.94);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 15;
      font-weight: 700;
      color: var(--ink-muted);
      text-align: center;
      padding: 20px;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(243,129,129,0.18);
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-size: 14px; max-width: 30ch; }

    /* ===== FLIPBOOK ===== */
    .flip-book {
      display: none;
      box-shadow: 0 8px 30px rgba(43,58,58,0.12);
      border-radius: 3px;
      background: #fcfaf7;
    }
    .page {
      background: var(--surface);
      overflow: hidden;
      border: none;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
    }
    .page canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    /* Halaman kosong untuk ganjil-genap */
    .page-blank {
      background: #faf8f5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c4b8a8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .page-blank::after {
      content: "—";
      opacity: 0.3;
    }

    /* ===== TOMBOL NAVIGASI ===== */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(43,58,58,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      cursor: pointer;
      z-index: 6;
      transition: all 0.15s ease;
      padding: 0;
    }
    .nav-btn:hover {
      color: #fff;
      background: var(--coral);
      border-color: var(--coral);
      transform: translateY(-50%) scale(1.05);
    }
    .nav-btn:disabled {
      opacity: 0.2;
      pointer-events: none;
      cursor: default;
    }
    .nav-btn svg {
      width: 18px;
      height: 18px;
    }
    .nav-prev { left: 8px; }
    .nav-next { right: 8px; }

    /* ===== IFRAME HTML ===== */
    #htmlViewer {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: var(--shadow-heavy);
    }

    /* ===== RESPONSIF ===== */
    @media (max-width: 768px) {
      .doc-title { max-width: 28vw; font-size: 0.75rem; }
      .header { padding: 8px 12px; }
      .btn-back { padding: 5px 10px; font-size: 12px; }
      .viewer-area { padding: 6px 4px 8px; }
      .stage-frame { border-radius: 16px; padding: clamp(6px, 2vw, 14px); }
      .stage-title { font-size: 0.75rem; }
      .page-indicator { font-size: 0.65rem; padding: 3px 8px; }
      .icon-btn { width: 28px; height: 28px; }
      .icon-btn svg { width: 14px; height: 14px; }
      .nav-btn { width: 34px; height: 34px; }
      .nav-btn svg { width: 15px; height: 15px; }
      .nav-prev { left: 4px; }
      .nav-next { right: 4px; }
      .progress-track { height: 2px; }
    }
    @media (max-width: 480px) {
      .doc-title { display: none; }
      .brand { font-size: 0.95rem; }
      .viewer-area { padding: 4px 2px 6px; }
      .stage-frame { border-radius: 12px; padding: 4px; }
      .stage-toolbar { gap: 4px; }
      .stage-title { font-size: 0.7rem; }
      .page-indicator { font-size: 0.6rem; padding: 2px 6px; }
      .nav-btn { width: 30px; height: 30px; }
      .nav-btn svg { width: 13px; height: 13px; }
      .nav-prev { left: 2px; }
      .nav-next { right: 2px; }
    }
    @media (min-width: 1200px) {
      .viewer-area { padding: 24px 30px; }
      .stage-frame { border-radius: 28px; padding: 30px; }
      .nav-btn { width: 48px; height: 48px; }
      .nav-prev { left: 16px; }
      .nav-next { right: 16px; }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="brand">
      <span class="logo-icon">📘</span>
      <span id="titleDisplay" class="doc-title">Memuat Dokumen…</span>
    </div>
    <a href="index.html" class="btn-back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Katalog
    </a>
  </header>

  <!-- ===== VIEWER ===== -->
  <main class="viewer-area">
    <div id="loadingScreen">
      <div class="spinner"></div>
      <span id="loadingText">Mengunduh dokumen, mohon tunggu…</span>
    </div>

    <div class="stage-wrap" id="stageWrap" hidden>
      <!-- Toolbar -->
      <div class="stage-toolbar">
        <span class="stage-title" id="stageTitle">Dokumen</span>
        <div class="stage-actions">
          <span class="page-indicator" id="pageIndicator" hidden>Halaman 1 / 0</span>
          <button class="icon-btn" id="fullscreenBtn" title="Layar penuh" hidden>
            <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-track" id="progressTrack" hidden>
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <!-- Frame buku -->
      <div class="stage-frame" id="stageFrame">
        <div id="book" class="flip-book"></div>
        <iframe id="htmlViewer" sandbox="allow-scripts allow-same-origin"></iframe>

        <!-- Tombol navigasi -->
        <button class="nav-btn nav-prev" id="navPrev" title="Halaman sebelumnya" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <button class="nav-btn nav-next" id="navNext" title="Halaman berikutnya" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <!-- ===== DEPENDENSI ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@1.5.5/dist/js/page-flip.browser.min.js"></script>

  <script>
    /**
     * ViewerEngine — Menangani render PDF/HTML, navigasi, fullscreen, dan tata letak ganjil-genap.
     * Optimasi: decoding Base64 via Fetch API, rendering kanvas dengan skala terbatas.
     * Responsif: ukuran buku dihitung ulang saat resize/fullscreen.
     */
    class ViewerEngine {
      constructor() {
        this.API_URL = "https://script.google.com/macros/s/AKfycbyJnpdt56Iu9zOlIQdbp00vapGrRYTyAAcvLFGLrh3hah04n6EwK_tgbrc5A1kUNw5y9A/exec";
        this.params = new URLSearchParams(window.location.search);
        this.flip = null;
        this.totalPages = 0;
        this.aspectRatio = 1.414; // fallback

        this.dom = {
          title: document.getElementById('titleDisplay'),
          loading: document.getElementById('loadingScreen'),
          loadingText: document.getElementById('loadingText'),
          spinner: document.querySelector('.spinner'),
          stageWrap: document.getElementById('stageWrap'),
          stageFrame: document.getElementById('stageFrame'),
          stageTitle: document.getElementById('stageTitle'),
          pageIndicator: document.getElementById('pageIndicator'),
          progressTrack: document.getElementById('progressTrack'),
          progressFill: document.getElementById('progressFill'),
          navPrev: document.getElementById('navPrev'),
          navNext: document.getElementById('navNext'),
          fullscreenBtn: document.getElementById('fullscreenBtn'),
          fullscreenIcon: document.getElementById('fullscreenIcon'),
          book: document.getElementById('book'),
          htmlViewer: document.getElementById('htmlViewer')
        };

        this.ICON_EXPAND = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
        this.ICON_COLLAPSE = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }

      init() {
        const title = this.params.get('judul');
        if (title) {
          this.dom.title.textContent = title;
          this.dom.stageTitle.textContent = title;
        }
        this.setupFullscreen();
        this.setupKeyboardNav();
        this.setupNavButtons();
        this.loadDocument();
      }

      // ===== NAVIGASI KEYBOARD =====
      setupKeyboardNav() {
        document.addEventListener('keydown', (e) => {
          if (!this.flip) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); this.flip.flipNext(); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); this.flip.flipPrev(); }
        });
      }

      // ===== TOMBOL NAVIGASI =====
      setupNavButtons() {
        this.dom.navPrev.addEventListener('click', () => {
          if (this.flip) this.flip.flipPrev();
        });
        this.dom.navNext.addEventListener('click', () => {
          if (this.flip) this.flip.flipNext();
        });
      }

      // ===== FULLSCREEN =====
      setupFullscreen() {
        const supported = document.fullscreenEnabled || document.webkitFullscreenEnabled;
        if (!supported) return;

        this.dom.fullscreenBtn.hidden = false;
        this.dom.fullscreenBtn.addEventListener('click', () => {
          const el = this.dom.stageWrap;
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (!isFs) {
            (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
          } else {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          }
        });

        const onFsChange = () => {
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          this.dom.fullscreenIcon.innerHTML = isFs ? this.ICON_COLLAPSE : this.ICON_EXPAND;
          this.dom.fullscreenBtn.title = isFs ? 'Keluar layar penuh' : 'Layar penuh';
          // Rebuild saat keluar/masuk fullscreen
          setTimeout(() => this.rebuildFlipBook(), 200);
        };
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
      }

      // ===== DECODE BASE64 =====
      async decodeBase64Optimized(base64Str) {
        const cleanStr = base64Str.replace(/\s/g, "");
        const dataUrl = `data:application/pdf;base64,${cleanStr}`;
        const response = await fetch(dataUrl);
        return new Uint8Array(await response.arrayBuffer());
      }

      // ===== LOAD DOKUMEN =====
      async loadDocument() {
        const fileId = this.params.get('id');
        const format = this.params.get('format');

        if (!fileId) {
          this.showError("Parameter ID File tidak ditemukan.");
          return;
        }

        try {
          const response = await fetch(`${this.API_URL}?action=getfile&id=${fileId}&format=${format}`);
          if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
          const data = await response.json();
          if (!data.ok) throw new Error(data.error || "Gagal mengambil berkas.");

          if (format === 'html') {
            this.renderHTML(data.content);
          } else if (format === 'pdf') {
            await this.renderPDF(data.content);
          } else {
            throw new Error(`Format tidak dikenali: ${format}`);
          }
        } catch (error) {
          this.showError(`Gagal memuat dokumen: ${error.message}`);
        }
      }

      // ===== HTML VIEWER =====
      renderHTML(content) {
        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.stageWrap.hidden = false;
          this.dom.htmlViewer.style.display = 'block';
          this.dom.htmlViewer.srcdoc = content;
          // Sembunyikan elemen flipbook & navigasi
          this.dom.book.style.display = 'none';
          this.dom.navPrev.hidden = true;
          this.dom.navNext.hidden = true;
          this.dom.pageIndicator.hidden = true;
          this.dom.progressTrack.hidden = true;
        }, 400);
      }

      // ===== PDF VIEWER =====
      async renderPDF(base64Content) {
        this.dom.loadingText.textContent = "Membuka dokumen…";

        const pdfData = await this.decodeBase64Optimized(base64Content);
        base64Content = null;

        const loadingTask = pdfjsLib.getDocument({ data: pdfData });
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        this.totalPages = totalPages;

        // Ukuran target
        const targetWidth = this.getTargetBookWidth();
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);

        const fragment = document.createDocumentFragment();
        const pageWrappers = [];
        let baseWidth = targetWidth;
        let baseHeight = targetWidth * 1.414;
        let rendered = 0;

        // ===== RENDER PER BATCH =====
        const renderPage = async (pageNum) => {
          const page = await pdf.getPage(pageNum);
          const nativeViewport = page.getViewport({ scale: 1 });

          if (pageNum === 1) {
            baseWidth = nativeViewport.width;
            baseHeight = nativeViewport.height;
          }

          const renderScale = (targetWidth * outputScale) / nativeViewport.width;
          const viewport = page.getViewport({ scale: renderScale });

          const wrapper = document.createElement('div');
          wrapper.className = 'page';

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d', { alpha: false });

          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          // Biarkan CSS yang mengatur ukuran tampil (width:100%; height:100%)
          // sehingga kanvas selalu mengikuti wadah .page

          wrapper.appendChild(canvas);
          pageWrappers[pageNum - 1] = wrapper;

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          rendered++;
          this.dom.loadingText.textContent = `Merender halaman ${rendered} dari ${totalPages}…`;
        };

        const BATCH_SIZE = 4;
        for (let start = 1; start <= totalPages; start += BATCH_SIZE) {
          const batch = [];
          for (let n = start; n < start + BATCH_SIZE && n <= totalPages; n++) {
            batch.push(renderPage(n));
          }
          await Promise.all(batch);
        }

        // ===== SISIPKAN HALAMAN KOSONG (GANJIL DI KANAN) =====
        const blankPage = document.createElement('div');
        blankPage.className = 'page page-blank';
        pageWrappers.unshift(blankPage);

        pageWrappers.forEach(w => fragment.appendChild(w));
        this.dom.book.appendChild(fragment);

        // ===== TAMPILKAN =====
        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.stageWrap.hidden = false;
          this.dom.book.style.display = 'block';
          this.aspectRatio = baseWidth / baseHeight;
          this.initFlipEngine(baseWidth, baseHeight, totalPages);
        }, 350);
      }

      // ===== UKURAN BUKU =====
      getTargetBookWidth() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        // Lebar responsif: di HP kecil, batasi agar tidak terlalu lebar
        const maxWidth = Math.min(vw - 40, 480);
        const minWidth = Math.min(200, vw - 24);
        return Math.round(Math.min(maxWidth, Math.max(minWidth, vw * 0.42)));
      }

      // ===== HITUNG UKURAN FIT =====
      computeFitSize(aspectRatio) {
        const rect = this.dom.stageFrame.getBoundingClientRect();
        const buffer = 16; // jarak aman
        const availW = Math.max(180, rect.width - buffer);
        const availH = Math.max(200, rect.height - buffer);

        // Karena spread = 2 halaman, lebar satu halaman = availW / 2
        const widthFromWidth = availW / 2;
        const widthFromHeight = availH * aspectRatio;

        let width = Math.min(widthFromWidth, widthFromHeight, 480);
        width = Math.max(width, 160);
        return { width: Math.round(width), height: Math.round(width / aspectRatio) };
      }

      // ===== INISIALISASI FLIP =====
      initFlipEngine(baseWidth, baseHeight, totalPages) {
        this.aspectRatio = baseWidth / baseHeight;
        this.totalPages = totalPages;
        this.buildFlipBook();

        // Resize handler
        clearTimeout(this._resizeTimer);
        const scheduleRebuild = () => {
          clearTimeout(this._resizeTimer);
          this._resizeTimer = setTimeout(() => this.rebuildFlipBook(), 200);
        };
        window.addEventListener('resize', scheduleRebuild);
        document.addEventListener('fullscreenchange', scheduleRebuild);
        document.addEventListener('webkitfullscreenchange', scheduleRebuild);
      }

      // ===== BANGUN FLIPBOOK =====
      buildFlipBook() {
        if (this.flip) {
          this.flip.destroy();
          this.flip = null;
        }

        const { width, height } = this.computeFitSize(this.aspectRatio);

        this.flip = new St.PageFlip(this.dom.book, {
          width: width,
          height: height,
          size: "fixed",
          minWidth: 160,
          maxWidth: 480,
          minHeight: 200,
          maxHeight: 800,
          showCover: false,
          mobileScrollSupport: true,
          maxShadowOpacity: 0.30,
          drawShadow: true,
          flippingTime: 600
        });

        this.flip.loadFromHTML(this.dom.book.querySelectorAll('.page'));

        // ===== INDICATOR & PROGRESS =====
        this.dom.pageIndicator.hidden = false;
        this.dom.progressTrack.hidden = false;
        this.dom.navPrev.hidden = false;
        this.dom.navNext.hidden = false;

        const updateUI = (currentIdx) => {
          // currentIdx = indeks halaman (0-based) dari page-flip
          // Karena ada blank di indeks 0, halaman 1 = indeks 1
          let displayPage = currentIdx;
          if (currentIdx === 0) displayPage = 1;
          if (currentIdx > this.totalPages) displayPage = this.totalPages;
          if (displayPage < 1) displayPage = 1;

          this.dom.pageIndicator.textContent = `Halaman ${displayPage} / ${this.totalPages}`;
          const progress = (currentIdx / (this.totalPages + 1)) * 100;
          this.dom.progressFill.style.width = Math.min(100, Math.max(0, progress)) + '%';
        };

        updateUI(1);
        this.flip.on('flip', (e) => updateUI(e.data));
      }

      // ===== REBUILD (resize / fullscreen) =====
      rebuildFlipBook() {
        if (this.flip) {
          const current = this.flip.getCurrentPageIndex();
          this.buildFlipBook();
          if (current > 0) {
            try { this.flip.turnToPage(current); } catch (_) {}
          }
        }
      }

      // ===== ERROR =====
      showError(msg) {
        console.error("Viewer Error:", msg);
        this.dom.loadingText.textContent = msg;
        this.dom.spinner.style.display = 'none';
        this.dom.loadingText.style.color = 'var(--coral)';
        this.dom.loadingText.style.fontWeight = '800';
      }
    }

    // ===== START =====
    document.addEventListener('DOMContentLoaded', () => {
      const viewer = new ViewerEngine();
      viewer.init();
    });
  </script>
</body>
</html>
