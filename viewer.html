<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Viewer Dokumen — KKG PAI Kulon Progo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #EAFFD0;
      --surface: #FFFFFF;
      --border: #E3F0D0;
      --ink: #2B3A3A;
      --ink-muted: #6E827D;
      --coral: #F38181;
      --coral-dark: #D65A5A;
      --mint: #95E1D3;
      --mint-dark: #2E8B7A;
      --header-bg: rgba(255,255,255,0.92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior-y: none;
    }

    .header {
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .brand {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .doc-title {
      color: var(--mint-dark);
      font-size: 0.95rem;
      font-weight: 700;
      background: rgba(149,225,211,0.25);
      padding: 4px 14px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45vw;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--coral);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-back:hover { 
      background: var(--coral-dark);
      transform: translateY(-1px);
    }

    .viewer-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 15px;
    }

    #loadingScreen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      z-index: 15;
      font-weight: 700;
      color: var(--ink-muted);
      text-align: center;
      padding: 20px;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(243, 129, 129, 0.2);
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .flip-book {
      display: none;
      box-shadow: 0 15px 40px rgba(43,58,58,0.18);
    }

    .page {
      background-color: var(--surface);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    #htmlViewer {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(43,58,58,0.10);
    }

    @media (max-width: 768px) {
      .doc-title { max-width: 30vw; font-size: 0.85rem; }
      .header { padding: 10px 14px; }
      .btn-back { padding: 6px 14px; font-size: 13px; }
      .viewer-area { padding: 5px; }
    }

    @media (max-width: 480px) {
      .doc-title { display: none; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <span class="logo-icon">📘</span>
      <span id="titleDisplay" class="doc-title">Memuat Dokumen...</span>
    </div>
    <a href="index.html" class="btn-back">⬅ Katalog</a>
  </header>

  <main class="viewer-area">
    <div id="loadingScreen">
      <div class="spinner"></div>
      <span id="loadingText">Mengunduh dokumen, mohon tunggu...</span>
    </div>

    <div id="book" class="flip-book"></div>
    <iframe id="htmlViewer" sandbox="allow-scripts allow-same-origin"></iframe>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

  <script>
    class ViewerEngine {
      constructor() {
        this.API_URL = "https://script.google.com/macros/s/AKfycbyJnpdt56Iu9zOlIQdbp00vapGrRYTyAAcvLFGLrh3hah04n6EwK_tgbrc5A1kUNw5y9A/exec";
        this.params = new URLSearchParams(window.location.search);
        
        this.dom = {
          title: document.getElementById('titleDisplay'),
          loading: document.getElementById('loadingScreen'),
          loadingText: document.getElementById('loadingText'),
          spinner: document.querySelector('.spinner'),
          book: document.getElementById('book'),
          htmlViewer: document.getElementById('htmlViewer')
        };
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }

      init() {
        const title = this.params.get('judul');
        if (title) this.dom.title.textContent = title;
        this.loadDocument();
      }

      /**
       * Engine Dekode Berkecepatan Tinggi (Native C++ Browser Execution)
       * Memanfaatkan Fetch API untuk mengubah Base64 menjadi ArrayBuffer
       * secara instan tanpa mengunci Main Thread JS (bebas freeze)
       */
      async decodeBase64Optimized(base64Str) {
        const cleanStr = base64Str.replace(/\s/g, "");
        const dataUrl = `data:application/pdf;base64,${cleanStr}`;
        const response = await fetch(dataUrl);
        return new Uint8Array(await response.arrayBuffer());
      }

      async loadDocument() {
        const fileId = this.params.get('id');
        const format = this.params.get('format');

        if (!fileId) {
          this.showError("Parameter ID File tidak ditemukan.");
          return;
        }

        try {
          const response = await fetch(`${this.API_URL}?action=getfile&id=${fileId}&format=${format}`);
          if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
          
          const data = await response.json();
          if (!data.ok) throw new Error(data.error);

          if (format === 'html') {
            this.renderHTML(data.content);
          } else if (format === 'pdf') {
            await this.renderPDF(data.content);
          }
        } catch (error) {
          this.showError(`Gagal memuat sistem: ${error.message}`);
        }
      }

      renderHTML(content) {
        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.htmlViewer.style.display = 'block';
          this.dom.htmlViewer.srcdoc = content; 
        }, 400);
      }

      async renderPDF(base64Content) {
        this.dom.loadingText.textContent = "Menyusun grafis resolusi tinggi...";
        
        // Eksekusi asinkron Fetch API menggantikan perulangan atob tradisional
        const pdfData = await this.decodeBase64Optimized(base64Content);
        base64Content = null; // Memicu Garbage Collection untuk pembersihan memori

        const loadingTask = pdfjsLib.getDocument({ data: pdfData });
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;

        // Skala adaptif untuk kejernihan gambar di layar Retina/FHD
        const outputScale = window.devicePixelRatio || 1;
        
        // Bulk DOM Write untuk mencegah layout thrashing
        const fragment = document.createDocumentFragment();
        let baseWidth = 450;
        let baseHeight = 636;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });

          // Tangkap dimensi halaman pertama sebagai acuan rasio aspek
          if (pageNum === 1) {
            baseWidth = viewport.width;
            baseHeight = viewport.height;
          }

          const pageWrapper = document.createElement('div');
          pageWrapper.className = 'page';
          
          // Nonaktifkan lapisan transparan (alpha) demi performa rendering GPU
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d', { alpha: false });
          
          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";

          const transform = outputScale !== 1 
            ? [outputScale, 0, 0, outputScale, 0, 0] 
            : null;

          pageWrapper.appendChild(canvas);
          fragment.appendChild(pageWrapper);

          await page.render({ 
            canvasContext: context, 
            transform: transform,
            viewport: viewport 
          }).promise;
        }

        // Menyisipkan seluruh DOM sekaligus
        this.dom.book.appendChild(fragment);
        
        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.book.style.display = 'block';
          this.initFlipEngine(baseWidth, baseHeight);
        }, 400);
      }

      initFlipEngine(baseWidth, baseHeight) {
        // Kalkulasi dinamis rasio aspek berdasarkan ukuran asli PDF
        const aspectRatio = baseWidth / baseHeight;

        const pageFlip = new St.PageFlip(this.dom.book, {
          width: 450,
          height: 450 / aspectRatio,
          size: "stretch",
          minWidth: 315,
          maxWidth: 700,
          minHeight: 420,
          maxHeight: 1000,
          showCover: false, 
          mobileScrollSupport: true,
          maxShadowOpacity: 0.35,
          drawShadow: true,
          flippingTime: 800
        });

        pageFlip.loadFromHTML(this.dom.book.querySelectorAll('.page'));
      }

      showError(msg) {
        console.error("Viewer Error:", msg);
        this.dom.loadingText.textContent = msg;
        this.dom.spinner.style.display = 'none';
        this.dom.loadingText.style.color = 'var(--coral)';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const viewer = new ViewerEngine();
      viewer.init();
    });
  </script>
</body>
</html>
