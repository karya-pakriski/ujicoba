<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Viewer Dokumen — KKG PAI Kulon Progo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ===== VARIABEL ===== */
    :root {
      --bg: #EAFFD0;
      --surface: #FFFFFF;
      --border: #E3F0D0;
      --ink: #2B3A3A;
      --ink-muted: #6E827D;
      --coral: #F38181;
      --coral-dark: #D65A5A;
      --mint: #95E1D3;
      --mint-dark: #2E8B7A;
      --header-bg: rgba(255,255,255,0.92);
      --shadow-heavy: 0 20px 50px rgba(43,58,58,0.18);
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior-y: none;
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.02);
    }
    .brand {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand .logo-icon { font-size: 1.4rem; }
    .doc-title {
      color: var(--mint-dark);
      font-size: 0.9rem;
      font-weight: 700;
      background: rgba(149,225,211,0.20);
      padding: 4px 14px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 42vw;
      margin-left: 4px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 18px;
      border-radius: 999px;
      background: var(--coral);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      flex-shrink: 0;
    }
    .btn-back:hover {
      background: var(--coral-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(243,129,129,0.30);
    }
    .btn-back svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.2; fill: none; }

    /* ===== VIEWER AREA ===== */
    .viewer-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 16px 20px 20px;
      background: 
        radial-gradient(ellipse at 30% 20%, rgba(149,225,211,0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(243,129,129,0.06) 0%, transparent 50%),
        #e8e2d6;
      background-image: 
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c4b8a8' fill-opacity='0.12'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* ===== STAGE WRAPPER (KOTAK PUTIH) ===== */
    .stage-wrap {
      width: 100%;
      height: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ===== TOOLBAR ===== */
    .stage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
      flex-shrink: 0;
    }
    .stage-title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--mint-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stage-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .page-indicator {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--ink-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .nav-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-group input[type="number"] {
      width: 56px;
      padding: 5px 6px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s;
    }
    .nav-group input[type="number"]:focus {
      border-color: var(--mint);
    }
    .nav-group input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
    .nav-btn {
      padding: 5px 14px;
      border: none;
      border-radius: 999px;
      background: var(--mint-dark);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all 0.15s ease;
    }
    .nav-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(46,139,122,0.30);
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      color: var(--coral);
      border-color: var(--coral);
      transform: translateY(-1px);
    }
    .icon-btn svg { width: 18px; height: 18px; }

    /* ===== FRAME (TEMPAT BUKU) ===== */
    .stage-frame {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(43,58,58,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2.5vw, 30px);
      position: relative;
      overflow: hidden;
    }
    /* Efek bayangan dalam untuk kedalaman */
    .stage-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.6) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ===== LOADING ===== */
    #loadingScreen {
      position: absolute;
      inset: 0;
      background: rgba(232, 226, 214, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      z-index: 15;
      font-weight: 700;
      color: var(--ink-muted);
      text-align: center;
      padding: 20px;
      transition: opacity 0.5s ease;
    }
    #loadingScreen .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(243, 129, 129, 0.18);
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText {
      font-size: 15px;
      max-width: 32ch;
    }

    /* ===== BUKU ===== */
    .flip-book {
      display: none;
      box-shadow: var(--shadow-heavy), 0 0 0 1px rgba(255,255,255,0.6) inset;
      border-radius: 4px;
      background: #fcfaf7;
      transition: box-shadow 0.3s ease;
    }
    .flip-book:hover {
      box-shadow: var(--shadow-heavy), 0 0 0 1px rgba(255,255,255,0.8) inset;
    }
    .page {
      background-color: var(--surface);
      overflow: hidden;
      border: none;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
    }
    .page canvas {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
    /* Halaman kosong (blank) sebagai sisipan */
    .page-blank {
      background: #faf8f5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c4b8a8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .page-blank::after {
      content: "—";
      opacity: 0.3;
    }

    #htmlViewer {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--surface);
      border-radius: 12px;
    }

    /* ===== RESPONSIF ===== */
    @media (max-width: 768px) {
      .doc-title { max-width: 30vw; font-size: 0.8rem; }
      .header { padding: 8px 14px; }
      .btn-back { padding: 5px 12px; font-size: 12px; }
      .viewer-area { padding: 10px 12px 14px; }
      .stage-frame { border-radius: 18px; padding: 12px; }
      .stage-title { font-size: 0.8rem; }
      .page-indicator { font-size: 0.7rem; padding: 4px 10px; }
      .nav-group input[type="number"] { width: 48px; padding: 4px 4px; font-size: 13px; }
      .nav-btn { padding: 4px 10px; font-size: 12px; }
    }
    @media (max-width: 480px) {
      .doc-title { display: none; }
      .stage-toolbar { flex-wrap: wrap; gap: 6px; }
      .stage-actions { margin-left: auto; }
    }
    @media (min-width: 1200px) {
      .viewer-area { padding: 24px 40px 30px; }
      .stage-frame { border-radius: 28px; padding: 32px; }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="brand">
      <span class="logo-icon">📘</span>
      <span id="titleDisplay" class="doc-title">Memuat Dokumen…</span>
    </div>
    <a href="index.html" class="btn-back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Katalog
    </a>
  </header>

  <!-- ===== VIEWER AREA ===== -->
  <main class="viewer-area">
    <div id="loadingScreen">
      <div class="spinner"></div>
      <span id="loadingText">Mengunduh dokumen, mohon tunggu…</span>
    </div>

    <div class="stage-wrap" id="stageWrap" hidden>
      <!-- TOOLBAR -->
      <div class="stage-toolbar">
        <span class="stage-title" id="stageTitle">Dokumen</span>
        <div class="stage-actions">
          <span class="page-indicator" id="pageIndicator" hidden>Halaman 1 / 0</span>
          <div class="nav-group" id="navGroup" hidden>
            <input type="number" id="pageInput" min="1" value="1" />
            <button class="nav-btn" id="goPageBtn">Go</button>
          </div>
          <button class="icon-btn" id="fullscreenBtn" title="Layar penuh" hidden>
            <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- FRAME BUKU -->
      <div class="stage-frame" id="stageFrame">
        <div id="book" class="flip-book"></div>
        <iframe id="htmlViewer" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </main>

  <!-- ===== DEPENDENSI ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@1.5.5/dist/js/page-flip.browser.min.js">
  </script>

  <script>
    class ViewerEngine {
      constructor() {
        this.API_URL = "https://script.google.com/macros/s/AKfycbyJnpdt56Iu9zOlIQdbp00vapGrRYTyAAcvLFGLrh3hah04n6EwK_tgbrc5A1kUNw5y9A/exec";
        this.params = new URLSearchParams(window.location.search);
        this.flip = null;
        this.totalContentPages = 0;
        this.aspectRatio = 1.414; // default

        this.dom = {
          title: document.getElementById('titleDisplay'),
          loading: document.getElementById('loadingScreen'),
          loadingText: document.getElementById('loadingText'),
          spinner: document.querySelector('.spinner'),
          stageWrap: document.getElementById('stageWrap'),
          stageFrame: document.getElementById('stageFrame'),
          stageTitle: document.getElementById('stageTitle'),
          pageIndicator: document.getElementById('pageIndicator'),
          pageInput: document.getElementById('pageInput'),
          goBtn: document.getElementById('goPageBtn'),
          navGroup: document.getElementById('navGroup'),
          fullscreenBtn: document.getElementById('fullscreenBtn'),
          fullscreenIcon: document.getElementById('fullscreenIcon'),
          book: document.getElementById('book'),
          htmlViewer: document.getElementById('htmlViewer')
        };

        this.ICON_EXPAND = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
        this.ICON_COLLAPSE = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }

      init() {
        const title = this.params.get('judul');
        if (title) {
          this.dom.title.textContent = title;
          this.dom.stageTitle.textContent = title;
        }
        this.setupFullscreen();
        this.bindNavigation();
        this.loadDocument();
      }

      // ===== FULLSCREEN =====
      setupFullscreen() {
        const supported = document.fullscreenEnabled || document.webkitFullscreenEnabled;
        if (!supported) {
          this.dom.fullscreenBtn.hidden = true;
          return;
        }
        this.dom.fullscreenBtn.hidden = false;
        this.dom.fullscreenBtn.addEventListener('click', () => {
          const el = this.dom.stageWrap;
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (!isFs) {
            (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
          } else {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          }
        });

        const onFsChange = () => {
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          this.dom.fullscreenIcon.innerHTML = isFs ? this.ICON_COLLAPSE : this.ICON_EXPAND;
          this.dom.fullscreenBtn.title = isFs ? 'Keluar layar penuh' : 'Layar penuh';
          if (this.flip) {
            // Ukuran ulang setelah transisi fullscreen
            requestAnimationFrame(() => this.rebuildFlip());
          }
        };
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
      }

      // ===== NAVIGASI =====
      bindNavigation() {
        this.dom.goBtn.addEventListener('click', () => this.jumpToPage());
        this.dom.pageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.jumpToPage();
        });
      }

      jumpToPage() {
        if (!this.flip) return;
        const raw = this.dom.pageInput.value.trim();
        const num = parseInt(raw, 10);
        if (isNaN(num) || num < 1 || num > this.totalContentPages) {
          this.dom.pageInput.value = this.dom.pageInput.dataset.current || '1';
          return;
        }
        // Karena ada halaman blank di indeks 0, maka halaman konten ke-1 berada di indeks 1
        const targetIdx = num; // indeks 0 = blank, indeks 1 = halaman 1
        this.flip.turnToPage(targetIdx);
      }

      updatePageIndicator(currentIdx) {
        // currentIdx adalah indeks 0-based dari halaman yang sedang aktif (kiri)
        // karena ada blank di 0, maka halaman konten ke-n berada di indeks n
        let pageNum = currentIdx;
        if (currentIdx === 0) pageNum = 1;
        if (currentIdx > this.totalContentPages) pageNum = this.totalContentPages;
        this.dom.pageIndicator.textContent = `Halaman ${pageNum} / ${this.totalContentPages}`;
        this.dom.pageInput.value = pageNum;
        this.dom.pageInput.dataset.current = pageNum;
      }

      // ===== LOAD DOKUMEN =====
      async loadDocument() {
        const fileId = this.params.get('id');
        const format = this.params.get('format');

        if (!fileId) {
          this.showError("Parameter ID File tidak ditemukan.");
          return;
        }

        try {
          const response = await fetch(`${this.API_URL}?action=getfile&id=${fileId}&format=${format}`);
          if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
          const data = await response.json();
          if (!data.ok) throw new Error(data.error || "Gagal mengambil berkas.");

          if (format === 'html') {
            this.renderHTML(data.content);
          } else if (format === 'pdf') {
            await this.renderPDF(data.content);
          } else {
            throw new Error(`Format tidak dikenali: ${format}`);
          }
        } catch (error) {
          this.showError(`Gagal memuat dokumen: ${error.message}`);
        }
      }

      renderHTML(content) {
        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.stageWrap.hidden = false;
          this.dom.htmlViewer.style.display = 'block';
          this.dom.htmlViewer.srcdoc = content;
          this.dom.pageIndicator.hidden = true;
          this.dom.navGroup.hidden = true;
        }, 400);
      }

      async renderPDF(base64Content) {
        this.dom.loadingText.textContent = "Membuka dokumen…";

        const pdfData = await this.decodeBase64Optimized(base64Content);
        base64Content = null;

        const loadingTask = pdfjsLib.getDocument({ data: pdfData });
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        this.totalContentPages = totalPages;

        // Ukuran target awal (akan di-fit ulang nanti)
        const targetWidth = 400;
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);

        const fragment = document.createDocumentFragment();
        const pageWrappers = [];
        let baseWidth = targetWidth;
        let baseHeight = targetWidth * 1.414;
        let rendered = 0;

        const renderPage = async (pageNum) => {
          const page = await pdf.getPage(pageNum);
          const nativeViewport = page.getViewport({ scale: 1 });

          if (pageNum === 1) {
            baseWidth = nativeViewport.width;
            baseHeight = nativeViewport.height;
            this.aspectRatio = baseWidth / baseHeight;
          }

          const renderScale = (targetWidth * outputScale) / nativeViewport.width;
          const viewport = page.getViewport({ scale: renderScale });

          const wrapper = document.createElement('div');
          wrapper.className = 'page';

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d', { alpha: false });

          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          canvas.style.width = Math.floor(viewport.width / outputScale) + 'px';
          canvas.style.height = Math.floor(viewport.height / outputScale) + 'px';

          wrapper.appendChild(canvas);
          pageWrappers[pageNum - 1] = wrapper;

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          rendered++;
          this.dom.loadingText.textContent = `Merender halaman ${rendered} dari ${totalPages}…`;
        };

        const BATCH_SIZE = 4;
        for (let start = 1; start <= totalPages; start += BATCH_SIZE) {
          const batch = [];
          for (let n = start; n < start + BATCH_SIZE && n <= totalPages; n++) {
            batch.push(renderPage(n));
          }
          await Promise.all(batch);
        }

        // Sisipkan halaman kosong di awal (agar halaman 1 di kanan)
        const blankPage = document.createElement('div');
        blankPage.className = 'page page-blank';
        fragment.appendChild(blankPage);

        pageWrappers.forEach(w => fragment.appendChild(w));

        this.dom.book.appendChild(fragment);

        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.stageWrap.hidden = false;
          this.dom.book.style.display = 'block';
          this.dom.pageIndicator.hidden = false;
          this.dom.navGroup.hidden = false;
          // Inisialisasi flip dengan ukuran yang pas
          this.initFlip();
        }, 350);
      }

      // ===== DECODE BASE64 =====
      async decodeBase64Optimized(base64Str) {
        const cleanStr = base64Str.replace(/\s/g, "");
        const dataUrl = `data:application/pdf;base64,${cleanStr}`;
        const response = await fetch(dataUrl);
        return new Uint8Array(await response.arrayBuffer());
      }

      // ===== INISIALISASI FLIP =====
      initFlip() {
        if (this.flip) {
          this.flip.destroy();
          this.flip = null;
        }
        const { width, height } = this.computeFitSize();
        this.flip = new St.PageFlip(this.dom.book, {
          width,
          height,
          size: "fixed",
          minWidth: 180,
          maxWidth: 500,
          minHeight: 240,
          maxHeight: 800,
          showCover: false,
          mobileScrollSupport: true,
          maxShadowOpacity: 0.35,
          drawShadow: true,
          flippingTime: 650
        });

        this.flip.loadFromHTML(this.dom.book.querySelectorAll('.page'));

        // Set halaman awal ke 1 (indeks 1)
        try {
          this.flip.turnToPage(1);
        } catch (_) {}

        // Update indikator
        this.updatePageIndicator(1);

        // Event flip
        this.flip.on('flip', (e) => {
          this.updatePageIndicator(e.data);
        });

        // Event resize & fullscreen akan memanggil rebuildFlip
        this.setupResizeListener();
      }

      // ===== COMPUTE FIT SIZE =====
      computeFitSize() {
        const rect = this.dom.stageFrame.getBoundingClientRect();
        const pad = 20; // padding dalam frame
        const availW = Math.max(200, rect.width - pad);
        const availH = Math.max(240, rect.height - pad);

        // Rasio aspek buku (lebar/tinggi per halaman)
        const ar = this.aspectRatio || 1.414;

        // Kita ingin lebar buku (total spread) = 2 * lebar halaman
        // atau tinggi buku = tinggi halaman.
        // Cari ukuran halaman yang muat dengan mempertimbangkan kedua dimensi.
        // Lebar halaman max dari lebar frame: availW / 2
        const maxPageW = availW / 2;
        const maxPageH = availH;

        // Ukuran halaman berdasarkan lebar
        let pageW = maxPageW;
        let pageH = pageW / ar;

        // Jika tinggi melebihi maxPageH, turunkan lebar
        if (pageH > maxPageH) {
          pageH = maxPageH;
          pageW = pageH * ar;
        }

        // Batasi agar tidak terlalu kecil
        pageW = Math.max(150, Math.min(480, pageW));
        pageH = pageW / ar;

        // Buku = spread (2 halaman)
        const bookW = pageW * 2;
        const bookH = pageH;

        return { width: bookW, height: bookH };
      }

      // ===== REBUILD FLIP =====
      rebuildFlip() {
        if (!this.flip) return;
        const { width, height } = this.computeFitSize();
        // Simpan halaman aktif
        let currentIdx = 0;
        try { currentIdx = this.flip.getCurrentPageIndex(); } catch (_) {}
        this.flip.updateSize(width, height);
        // Page-flip dengan size:fixed tidak otomatis memuat ulang halaman, jadi kita perlu reload
        // Alternatif: destroy dan buat ulang
        // Lebih aman: destroy + recreate
        const pages = this.dom.book.querySelectorAll('.page');
        this.flip.destroy();
        this.flip = new St.PageFlip(this.dom.book, {
          width,
          height,
          size: "fixed",
          minWidth: 180,
          maxWidth: 500,
          minHeight: 240,
          maxHeight: 800,
          showCover: false,
          mobileScrollSupport: true,
          maxShadowOpacity: 0.35,
          drawShadow: true,
          flippingTime: 650
        });
        this.flip.loadFromHTML(pages);
        try {
          this.flip.turnToPage(Math.min(currentIdx, pages.length - 1));
        } catch (_) {}
        this.flip.on('flip', (e) => this.updatePageIndicator(e.data));
        this.updatePageIndicator(currentIdx);
      }

      setupResizeListener() {
        let timeout;
        const handler = () => {
          clearTimeout(timeout);
          timeout = setTimeout(() => {
            if (this.flip) {
              this.rebuildFlip();
            }
          }, 250);
        };
        window.addEventListener('resize', handler);
        document.addEventListener('fullscreenchange', handler);
        document.addEventListener('webkitfullscreenchange', handler);
        // Simpan referensi untuk cleanup jika perlu (tidak wajib)
        this._resizeHandler = handler;
      }

      showError(msg) {
        console.error("Viewer Error:", msg);
        this.dom.loadingText.textContent = msg;
        this.dom.spinner.style.display = 'none';
        this.dom.loadingText.style.color = 'var(--coral)';
        this.dom.loadingText.style.fontWeight = '800';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const viewer = new ViewerEngine();
      viewer.init();
    });
  </script>
</body>
</html>
