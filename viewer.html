<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Viewer Dokumen — KKG PAI Kulon Progo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ====== CSS SAMA ====== */
    :root {
      --bg: #EAFFD0;
      --surface: #FFFFFF;
      --border: #E3F0D0;
      --ink: #2B3A3A;
      --ink-muted: #6E827D;
      --coral: #F38181;
      --coral-dark: #D65A5A;
      --mint: #95E1D3;
      --mint-dark: #2E8B7A;
      --header-bg: rgba(255,255,255,0.92);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior-y: none;
    }

    .header {
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      flex-shrink: 0;
    }
    .brand { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
    .doc-title {
      color: var(--mint-dark); font-size: 0.95rem; font-weight: 700; background: rgba(149,225,211,0.25);
      padding: 4px 14px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45vw;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 999px;
      background: var(--coral); color: #fff; font-weight: 800; font-size: 14px; text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-back:hover { background: var(--coral-dark); transform: translateY(-1px); }

    .viewer-area { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 18px; min-height: 0; }

    .stage-wrap { width: 100%; height: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

    .stage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 4px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .stage-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 0.92rem; color: var(--mint-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stage-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .page-indicator {
      font-size: 0.78rem; font-weight: 800; color: var(--ink-muted); background: var(--surface); border: 1px solid var(--border);
      padding: 5px 13px; border-radius: 999px; white-space: nowrap;
    }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
      display: flex; align-items: center; justify-content: center; color: var(--ink-muted); cursor: pointer;
      transition: all 0.15s ease; flex-shrink: 0; padding: 0;
    }
    .icon-btn:hover:not(:disabled) { color: var(--coral); border-color: var(--coral); transform: translateY(-1px); }
    .icon-btn:disabled { opacity: 0.35; cursor: default; }
    .icon-btn svg { width: 17px; height: 17px; }

    .zoom-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 6px;
      flex-shrink: 0;
    }
    .zoom-group .icon-btn {
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
    }
    .zoom-group .icon-btn svg { width: 14px; height: 14px; }
    .zoom-level {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--ink-muted);
      min-width: 40px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .zoom-level:hover { color: var(--coral); }

    .stage-frame {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(43,58,58,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2vw, 24px);
      position: relative;
      overflow: hidden;
    }
    .stage-frame.is-zoomed { overflow: auto; align-items: flex-start; justify-content: flex-start; cursor: grab; }
    .stage-frame.is-zoomed:active { cursor: grabbing; }

    .stage-wrap:fullscreen, .stage-wrap:-webkit-full-screen { max-width: 100%; padding: 16px; background: var(--bg); }
    .stage-wrap:fullscreen .stage-frame, .stage-wrap:-webkit-full-screen .stage-frame { border-radius: 18px; }

    .progress-track { height: 4px; border-radius: 999px; background: var(--border); overflow: hidden; flex-shrink: 0; margin: 0 4px; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--mint), var(--coral)); border-radius: 999px; transition: width 0.35s cubic-bezier(0.4,0,0.2,1); }

    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--border); background: rgba(255,255,255,0.9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 10px 24px rgba(43,58,58,0.14); display: flex; align-items: center; justify-content: center;
      color: var(--ink-muted); cursor: pointer; z-index: 6; transition: all 0.15s ease;
    }
    .nav-btn:hover:not(:disabled) { color: #fff; background: var(--coral); border-color: var(--coral); transform: translateY(-50%) scale(1.08); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
    .nav-btn svg { width: 19px; height: 19px; }
    .nav-prev { left: 14px; }
    .nav-next { right: 14px; }
    .stage-frame.is-zoomed .nav-btn { display: none; }

    #loadingScreen {
      position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center;
      align-items: center; gap: 18px; z-index: 15; font-weight: 700; color: var(--ink-muted); text-align: center;
      padding: 20px; transition: opacity 0.4s ease;
    }
    .spinner { width: 44px; height: 44px; border: 4px solid rgba(243,129,129,0.2); border-top-color: var(--coral); border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4,0,0.2,1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .flip-book {
      display: none;
      box-shadow: none;
      width: 100% !important;
      height: 100% !important;
    }

    .book-zoom-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center center;
      overflow: visible;
    }

    .page {
      background-color: var(--surface);
      overflow: hidden;
      border: 1px solid var(--border);
      width: 100%;
      height: 100%;
    }
    .page img, .page iframe {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border: none;
      background: #fff;
    }
    .page iframe {
      overflow: auto;
    }
    .page-blank {
      background: transparent !important;
      border: none !important;
    }
    .page-blank img, .page-blank iframe {
      display: none !important;
    }

    @media (max-width: 768px) {
      .doc-title { max-width: 30vw; font-size: 0.85rem; }
      .header { padding: 10px 14px; }
      .btn-back { padding: 6px 14px; font-size: 13px; }
      .viewer-area { padding: 8px; }
      .stage-frame { border-radius: 18px; padding: 12px; }
      .stage-title { font-size: 0.8rem; }
      .page-indicator { font-size: 0.7rem; padding: 4px 10px; }
      .nav-btn { width: 36px; height: 36px; }
      .nav-btn svg { width: 15px; height: 15px; }
      .nav-prev { left: 6px; }
      .nav-next { right: 6px; }
    }
    @media (max-width: 480px) { .doc-title { display: none; } }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <span class="logo-icon">📘</span>
      <span id="titleDisplay" class="doc-title">Memuat Dokumen...</span>
    </div>
    <a href="index.html" class="btn-back">⬅ Katalog</a>
  </header>

  <main class="viewer-area">
    <div id="loadingScreen">
      <div class="spinner"></div>
      <span id="loadingText">Mengunduh dokumen, mohon tunggu...</span>
    </div>

    <div class="stage-wrap" id="stageWrap" hidden>
      <div class="stage-toolbar">
        <span class="stage-title" id="stageTitle">Dokumen</span>
        <div class="stage-actions">
          <span class="page-indicator" id="pageIndicator" hidden></span>
          <div class="zoom-group" id="zoomGroup" hidden>
            <button class="icon-btn" id="zoomOutBtn" title="Perkecil">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
            </button>
            <span class="zoom-level" id="zoomLevelLabel" title="Klik untuk reset ke 100%">100%</span>
            <button class="icon-btn" id="zoomInBtn" title="Perbesar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
          </div>
          <button class="icon-btn" id="downloadBtn" title="Unduh" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          </button>
          <button class="icon-btn" id="fullscreenBtn" title="Layar penuh" hidden>
            <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="progress-track" id="progressTrack" hidden><div class="progress-fill" id="progressFill"></div></div>
      <div class="stage-frame" id="stageFrame">
        <div id="bookZoomWrap" class="book-zoom-wrap">
          <div id="book" class="flip-book"></div>
        </div>
        <button class="nav-btn nav-prev" id="navPrev" title="Halaman sebelumnya (←)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="nav-btn nav-next" id="navNext" title="Halaman berikutnya (→)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

  <script>
    class ViewerEngine {
      constructor() {
        this.API_URL = "https://script.google.com/macros/s/AKfycbyJnpdt56Iu9zOlIQdbp00vapGrRYTyAAcvLFGLrh3hah04n6EwK_tgbrc5A1kUNw5y9A/exec";
        this.params = new URLSearchParams(window.location.search);
        this.judul = this.params.get('judul') || 'Dokumen';
        this.format = (this.params.get('format') || '').toLowerCase();
        this.rawBytes = null;
        this.pageFragments = [];
        this.originalHead = '';
        this.pageFlip = null;
        this.totalPages = 0;
        this.objectUrls = [];
        this.zoomLevel = 1;
        this.ZOOM_MIN = 1;
        this.ZOOM_MAX = 2.5;
        this.ZOOM_STEP = 0.25;

        // Untuk efek suara
        this.audioCtx = null;
        this.noiseBuffer = null;

        this.dom = {
          title: document.getElementById('titleDisplay'),
          loading: document.getElementById('loadingScreen'),
          loadingText: document.getElementById('loadingText'),
          spinner: document.querySelector('.spinner'),
          stageWrap: document.getElementById('stageWrap'),
          stageFrame: document.getElementById('stageFrame'),
          stageTitle: document.getElementById('stageTitle'),
          pageIndicator: document.getElementById('pageIndicator'),
          progressTrack: document.getElementById('progressTrack'),
          progressFill: document.getElementById('progressFill'),
          navPrev: document.getElementById('navPrev'),
          navNext: document.getElementById('navNext'),
          fullscreenBtn: document.getElementById('fullscreenBtn'),
          fullscreenIcon: document.getElementById('fullscreenIcon'),
          downloadBtn: document.getElementById('downloadBtn'),
          zoomGroup: document.getElementById('zoomGroup'),
          zoomInBtn: document.getElementById('zoomInBtn'),
          zoomOutBtn: document.getElementById('zoomOutBtn'),
          zoomLevelLabel: document.getElementById('zoomLevelLabel'),
          book: document.getElementById('book'),
          bookZoomWrap: document.getElementById('bookZoomWrap')
        };

        this.ICON_EXPAND = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
        this.ICON_COLLAPSE = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      }

      init() {
        this.dom.title.textContent = this.judul;
        this.dom.stageTitle.textContent = this.judul;
        this.setupFullscreen();
        this.setupKeyboardNav();
        this.setupDownload();
        this.setupZoomControls();
        this.setupResizeGuard();
        this.setupAudio();
        this.loadDocument();
      }

      // --- Setup Audio untuk suara kertas ---
      setupAudio() {
        // Buat AudioContext saat interaksi pertama (click) agar tidak diblokir browser
        const initAudio = () => {
          if (!this.audioCtx) {
            try {
              this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              this.createNoiseBuffer();
            } catch (e) { /* audio tidak didukung */ }
          }
          if (this.audioCtx && this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
          }
        };
        // Inisialisasi saat pengguna berinteraksi dengan viewer (klik di mana saja)
        document.addEventListener('click', initAudio, { once: true });
        // Juga saat tombol navigasi ditekan (prev/next)
        this.dom.navPrev.addEventListener('click', initAudio);
        this.dom.navNext.addEventListener('click', initAudio);
        // Dan saat flip event (akan dipanggil dari playPaperSound)
      }

      createNoiseBuffer() {
        if (!this.audioCtx) return;
        const duration = 0.15; // detik
        const sampleRate = this.audioCtx.sampleRate;
        const bufferSize = Math.floor(duration * sampleRate);
        const buffer = this.audioCtx.createBuffer(1, bufferSize, sampleRate);
        const data = buffer.getChannelData(0);
        // White noise
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.3;
        }
        this.noiseBuffer = buffer;
      }

      playPaperSound() {
        if (!this.audioCtx) return;
        // Resume context jika suspended (misal setelah interaksi)
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        if (this.audioCtx.state !== 'running') return;
        if (!this.noiseBuffer) return;

        const source = this.audioCtx.createBufferSource();
        source.buffer = this.noiseBuffer;

        const gainNode = this.audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.5, this.audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.15);

        // Filter untuk memberi kesan kertas (low-pass)
        const filter = this.audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 3000;
        filter.Q.value = 1;

        source.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(this.audioCtx.destination);

        source.start();
        source.stop(this.audioCtx.currentTime + 0.2);
      }

      // --- Lanjut method lainnya ---

      setupKeyboardNav() {
        document.addEventListener('keydown', (e) => {
          if (!this.pageFlip) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); this.pageFlip.flipNext(); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); this.pageFlip.flipPrev(); }
          else if (e.key === '+' || e.key === '=') { e.preventDefault(); this.applyZoom(this.zoomLevel + this.ZOOM_STEP); }
          else if (e.key === '-') { e.preventDefault(); this.applyZoom(this.zoomLevel - this.ZOOM_STEP); }
          else if (e.key === '0') { e.preventDefault(); this.applyZoom(1); }
        });
      }

      setupFullscreen() {
        const supported = document.fullscreenEnabled || document.webkitFullscreenEnabled;
        if (!supported) return;
        this.dom.fullscreenBtn.hidden = false;
        this.dom.fullscreenBtn.addEventListener('click', () => {
          const el = this.dom.stageWrap;
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (!isFs) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
          else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        });
        const onFsChange = () => {
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          this.dom.fullscreenIcon.innerHTML = isFs ? this.ICON_COLLAPSE : this.ICON_EXPAND;
          this.dom.fullscreenBtn.title = isFs ? 'Keluar layar penuh' : 'Layar penuh';
          requestAnimationFrame(() => this.refreshFlipLayout());
        };
        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
      }

      setupDownload() {
        this.dom.downloadBtn.addEventListener('click', () => {
          if (this.format === 'pdf' && this.rawBytes) {
            const blob = new Blob([this.rawBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = this.judul + '.pdf';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          } else if (this.format === 'html') {
            this.printHtmlAsPdf();
          }
        });
      }

      printHtmlAsPdf() {
        const body = this.pageFragments.map(f => '<div style="page-break-after:always;">' + f + '</div>').join('');
        const doc = '<!DOCTYPE html><html><head><meta charset="UTF-8">' + this.originalHead +
          '<title>' + this.judul + '</title></head><body>' + body +
          '<script>window.onload=function(){setTimeout(function(){window.print();},400);};<\/script></body></html>';
        const w = window.open('', '_blank');
        if (!w) { alert('Popup diblokir browser. Izinkan popup untuk mengunduh sebagai PDF.'); return; }
        w.document.write(doc);
        w.document.close();
      }

      setupZoomControls() {
        this.dom.zoomInBtn.addEventListener('click', () => this.applyZoom(this.zoomLevel + this.ZOOM_STEP));
        this.dom.zoomOutBtn.addEventListener('click', () => this.applyZoom(this.zoomLevel - this.ZOOM_STEP));
        this.dom.zoomLevelLabel.addEventListener('click', () => this.applyZoom(1));
      }

      applyZoom(level) {
        this.zoomLevel = Math.min(this.ZOOM_MAX, Math.max(this.ZOOM_MIN, level));
        const zoomed = this.zoomLevel > 1.001;
        const wrap = this.dom.bookZoomWrap;

        wrap.style.transform = 'scale(' + this.zoomLevel + ')';
        if (zoomed) {
          wrap.style.transformOrigin = 'top left';
          wrap.style.alignItems = 'flex-start';
          wrap.style.justifyContent = 'flex-start';
        } else {
          wrap.style.transformOrigin = 'center center';
          wrap.style.alignItems = 'center';
          wrap.style.justifyContent = 'center';
        }

        this.dom.stageFrame.classList.toggle('is-zoomed', zoomed);
        this.dom.zoomLevelLabel.textContent = Math.round(this.zoomLevel * 100) + '%';
        this.dom.zoomOutBtn.disabled = this.zoomLevel <= this.ZOOM_MIN + 0.001;
        this.dom.zoomInBtn.disabled = this.zoomLevel >= this.ZOOM_MAX - 0.001;

        this.dom.stageFrame.scrollTop = 0;
        this.dom.stageFrame.scrollLeft = 0;
      }

      setupResizeGuard() {
        let t;
        const onResize = () => {
          clearTimeout(t);
          t = setTimeout(() => this.refreshFlipLayout(), 200);
        };
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', onResize);
      }

      refreshFlipLayout() {
        if (this.pageFlip) {
          try { this.pageFlip.update(); } catch (e) { /* abaikan */ }
        }
      }

      async loadDocument() {
        const fileId = this.params.get('id');
        if (!fileId) { this.showError("Parameter ID file tidak ditemukan."); return; }
        try {
          const res = await fetch(`${this.API_URL}?action=getfile&id=${encodeURIComponent(fileId)}&format=${encodeURIComponent(this.format)}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!data.ok) throw new Error(data.error);

          if (this.format === 'html') this.buildHtmlPages(data.content);
          else if (this.format === 'pdf') await this.buildPdfPages(data.content);
          else throw new Error('Format tidak dikenal: ' + this.format);

          this.mountBook();
        } catch (err) {
          this.showError(`Gagal memuat dokumen: ${err.message}`);
        }
      }

      buildHtmlPages(htmlText) {
        const doc = new DOMParser().parseFromString(htmlText, 'text/html');
        this.originalHead = doc.head ? doc.head.innerHTML : '';
        let nodes = doc.querySelectorAll('.page, .halaman, [data-page]');
        this.pageFragments = nodes.length
          ? Array.from(nodes).map(n => n.outerHTML)
          : [doc.body ? doc.body.innerHTML : htmlText];

        this.aspectRatio = 0.72;
        this.pageElements = this.pageFragments.map(frag => {
          const wrapper = document.createElement('div');
          wrapper.className = 'page';
          const iframe = document.createElement('iframe');
          iframe.setAttribute('sandbox', 'allow-same-origin');
          iframe.srcdoc = '<!DOCTYPE html><html><head>' + this.originalHead +
            '<style>html,body{margin:0;padding:22px;background:#fff;}</style></head><body>' + frag + '</body></html>';
          wrapper.appendChild(iframe);
          return wrapper;
        });
        this.totalPages = this.pageElements.length;
      }

      async buildPdfPages(base64) {
        this.dom.loadingText.textContent = "Membuka dokumen...";
        const binary = atob(base64.replace(/\s/g, ""));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        this.rawBytes = bytes;

        const pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
        const totalPages = pdf.numPages;
        this.totalPages = totalPages;

        const targetWidth = Math.round(Math.min(700, Math.max(320, window.innerWidth - 60)));
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);

        const pageWrappers = new Array(totalPages);
        let rendered = 0;
        let baseRatio = 0.72;

        const renderPage = async (pageNum) => {
          const page = await pdf.getPage(pageNum);
          const nativeViewport = page.getViewport({ scale: 1 });
          if (pageNum === 1) baseRatio = nativeViewport.width / nativeViewport.height;

          const renderScale = (targetWidth * outputScale) / nativeViewport.width;
          const viewport = page.getViewport({ scale: renderScale });

          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          const context = canvas.getContext('2d', { alpha: false });
          await page.render({ canvasContext: context, viewport }).promise;

          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
          const url = URL.createObjectURL(blob);
          this.objectUrls.push(url);

          const wrapper = document.createElement('div');
          wrapper.className = 'page';
          const img = document.createElement('img');
          img.src = url;
          img.alt = 'Halaman ' + pageNum;
          wrapper.appendChild(img);
          pageWrappers[pageNum - 1] = wrapper;

          rendered++;
          this.dom.loadingText.textContent = `Merender halaman ${rendered} dari ${totalPages}...`;
        };

        const BATCH_SIZE = 4;
        for (let start = 1; start <= totalPages; start += BATCH_SIZE) {
          const batch = [];
          for (let n = start; n < start + BATCH_SIZE && n <= totalPages; n++) batch.push(renderPage(n));
          await Promise.all(batch);
        }

        this.aspectRatio = baseRatio;
        this.pageElements = pageWrappers;
      }

      mountBook() {
        const fragment = document.createDocumentFragment();
        let pages = this.pageElements.slice();
        if (pages.length % 2 === 1) {
          const blank = document.createElement('div');
          blank.className = 'page page-blank';
          pages.push(blank);
        }
        pages.forEach(el => fragment.appendChild(el));
        this.dom.book.appendChild(fragment);
        this.totalPages = pages.length;

        this.dom.loading.style.opacity = '0';
        setTimeout(() => {
          this.dom.loading.style.display = 'none';
          this.dom.stageWrap.hidden = false;
          this.dom.book.style.display = 'block';
          this.dom.downloadBtn.hidden = false;
          this.dom.zoomGroup.hidden = false;
          this.initFlipEngine();
        }, 250);
      }

      initFlipEngine() {
        this.pageFlip = new St.PageFlip(this.dom.book, {
          width: 400,
          height: Math.round(400 / this.aspectRatio),
          size: "stretch",
          minWidth: 200,
          maxWidth: 700,
          minHeight: 200,
          maxHeight: 9999,
          showCover: false,
          usePortrait: true,
          mobileScrollSupport: true,
          maxShadowOpacity: 0,
          drawShadow: false,
          flippingTime: 700
        });

        this.pageFlip.loadFromHTML(this.dom.book.querySelectorAll('.page'));

        this.dom.pageIndicator.hidden = false;
        this.dom.progressTrack.hidden = false;
        this.dom.navPrev.hidden = false;
        this.dom.navNext.hidden = false;

        const visiblePages = this.pageElements.length;
        const updateUI = (current) => {
          let actual = current + 1;
          if (actual > visiblePages) actual = visiblePages;
          this.dom.pageIndicator.textContent = `Halaman ${actual} / ${visiblePages}`;
          this.dom.progressFill.style.width = `${(actual / visiblePages) * 100}%`;
          this.dom.navPrev.disabled = (current <= 0);
          this.dom.navNext.disabled = (current >= this.totalPages - 1);
        };
        updateUI(0);

        // --- Tambahkan efek suara pada event flip ---
        this.pageFlip.on('flip', (e) => {
          updateUI(e.data);
          this.playPaperSound();
        });

        this.dom.navPrev.addEventListener('click', () => this.pageFlip.flipPrev());
        this.dom.navNext.addEventListener('click', () => this.pageFlip.flipNext());

        this.applyZoom(1);
      }

      showError(msg) {
        console.error("Viewer Error:", msg);
        this.dom.loadingText.textContent = msg;
        this.dom.spinner.style.display = 'none';
        this.dom.loadingText.style.color = 'var(--coral)';
      }

      cleanup() {
        this.objectUrls.forEach(u => URL.revokeObjectURL(u));
        if (this.audioCtx) {
          try { this.audioCtx.close(); } catch (e) {}
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const viewer = new ViewerEngine();
      viewer.init();
      window.addEventListener('beforeunload', () => viewer.cleanup());
    });
  </script>
</body>
</html>
